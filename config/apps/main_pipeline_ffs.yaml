# main_pipeline FFS 路径:D435iStereo(IR)→ FFS 优化深度 → align 彩色 → EconomicGrasp → o3d
components:
  camera:
    backend: d435i_stereo
    width: 640
    height: 480
    fps: 30
    discard_frames: 5
  depth:
    backend: ffs
    model: Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth
    scale: 0.5
    valid_iters: 4
    max_disp: 192
  grasp_engine:
    backend: economic
    checkpoint: economic_grasp/checkpoint/economicgrasp_epoch10.tar
    use_collision: true
  visualizer:
    backend: o3d
    title: "D435i FFS+Grasp  [Q] quit"
