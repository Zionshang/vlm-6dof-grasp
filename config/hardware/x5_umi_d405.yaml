# =============================================================================
# 硬件配置 profile:X5_umi 机械臂 + RealSense D405 相机(+ LCM 通信)
# -----------------------------------------------------------------------------
# 所有数值均原样来自原代码,请勿随意修改。
# 更换硬件(机械臂 / 相机 / 通信)时,新建一个 profile yaml,并把
# core/hardware.py 的 DEFAULT_PROFILE 指向它即可,业务代码无需改动。
# =============================================================================

name: x5_umi_d405

# ---- 机械臂驱动(由 core/robot_client.make_robot_client 分发)----
robot:
  kind: arx5_lcm

# ---- 相机(RealSense D405)----
camera:
  intrinsic:
    - [435.75600787289994, 0.0, 423.5139606211078]
    - [0.0, 435.6741418717883, 243.52287948995928]
    - [0.0, 0.0, 1.0]
  dist_coeffs: [-0.061438834574162444, 0.11244487882386699, -0.0008922372006081498, 0.0010226929723920338, -0.09769331639799333]
  factor_depth: 10000

# ---- 手眼标定(相机 -> 末端)----
hand_eye:
  rotation:
    - [-0.006092615385294875, -0.3027725149342249, 0.9530433800400533]
    - [-0.999954699443327, -0.005125146873484365, -0.008020718841149077]
    - [0.007312940514623167, -0.9530490737994176, -0.30272757362205927]
  translation: [-0.1932219485813188, 0.010310356659821916, 0.1095743344596426]

# ---- 夹爪(X5_umi)----
gripper:
  max_width: 0.085        # 抓取闭合上限(grip_max)
  approach_width: 0.086   # 就绪/接近时夹爪张开宽度

# ---- 工作空间安全边界(统一)----
workspace_bounds:
  x: [0.0, 0.75]
  y: [-0.65, 0.65]
  z_max: 0.7              # 仅上界检查(原 lcm 行为)

# ---- 机械臂位姿 [x, y, z, rx, ry, rz] ----
poses:
  home: [0.3202, 0.001, 0.1565, 0.0, 0.0, 0.0]
  drop: [0.426, 0.001, 0.235, -0.008, 0.801, 0.002]
  ready_views:            # run_grasp_lcm 多视角就绪位姿
    - [0.23, 0.0, 0.28, 0.0, 0.65, 0.0]
    - [0.256, 0.14, 0.26, 0.07, 0.65, 0.57]
    - [0.256, -0.14, 0.26, -0.01, 0.65, -0.57]
  realtime_ready_action: [0.25, 0.0, 0.17, 0.0, 1.0, 0.0]   # run_realtime action_new_prompt
  realtime_ready_main: [0.25, 0.0, 0.17, 0.0, 0.95, 0.0]    # run_realtime main

# ---- LCM 通信 ----
lcm:
  task_url: "udpm://239.255.76.67:50000?ttl=1"
  cmd_channel: "mani/cmd"
  callback_channel: "mani/callback"
  arm:
    address: "239.255.76.67"
    port: 7667
    ttl: 1
