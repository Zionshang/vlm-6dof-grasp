# Good D405: live YOLO preview; press 1 for FFS + EfficientSAM + grasp.
components:
  camera:
    backend: d405_stereo
    width: 848
    height: 480
    fps: 30
    discard_frames: 5
  depth:
    backend: ffs
    model: third_party/Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth
    scale: 0.5
    valid_iters: 4
    max_disp: 192
  detector:
    backend: yolo
    weights: models/yolo26/best.pt
    confidence: 0.4
    iou: 0.7
    imgsz: 640
    max_det: 20
    device: 0
  segmenter:
    backend: efficient_sam
    weights: third_party/EfficientSAM/weights/efficient_sam_vitt.pt
    device: cuda
    min_containment: 0.9
    min_coverage: 0.1
  grasp_engine:
    backend: graspgenx
    checkpoint_dir: third_party/GraspGenX/ext/graspgenx_checkpoints/release
    assets_dir: third_party/GraspGenX/assets
    gripper: piper_hand
    planner: diffusion
    num_grasps: 100
    grasp_threshold: -1.0
    min_input_points: 100
    max_input_points: 5000
    min_depth_m: 0.10
    max_depth_m: 0.65
    use_collision: true
    collision_threshold: 0.01
    max_scene_points: 8192
    num_collision_samples: 2000
    collision_batch_size: 16
  visualizer:
    backend: graspgenx_o3d
    title: "D405 YOLO + EfficientSAM + GraspGenX"
    show_top_mesh: true
    top_mesh_color: [0.1, 0.5, 1.0]

pipeline:
  box_scale: 1.15
  predict_topk: 100
  visualize_topk: 50
  min_depth_points: 100
