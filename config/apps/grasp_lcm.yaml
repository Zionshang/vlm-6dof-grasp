# Piper + D405 grasp composition; Registry metadata resolves dependencies.
components:
  robot:
    backend: piper_lcm
  camera:
    backend: d405_stereo
    width: 848
    height: 480
    fps: 30
    discard_frames: 5
  depth:
    backend: ffs
    model: Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth
    scale: 0.5
    valid_iters: 4
    max_disp: 192
  detector:
    backend: vlm
    model: qwen3-vl:8b-instruct-q4_K_M
    host: http://127.0.0.1:11434
    # Bound Ollama's KV cache and release it after each VLM request. The GPU is
    # shared with FFS, FastSAM and EconomicGrasp.
    num_ctx: 4096
    keep_alive: 0
  segmenter:
    backend: fastsam
    weights: fastsam/weight/FastSAM-s.pt
    use_sam: true
  grasp_engine:
    backend: economic
    checkpoint: economic_grasp/checkpoint/economicgrasp_epoch10.tar
    use_collision: true
  selector:
    backend: first
  executor:
    backend: grasp
  visualizer:
    backend: o3d
    lazy: true
    title: "Piper D405 FFS Grasp Test"

pipeline:
  predict_topk: 100
  selector_topk: 8
  filter_orientation: true
  save_debug: true
