# Manual RealSense D405 + FFS + YOLO + EfficientSAM + OBB integration test.
components:
  camera:
    backend: d405_stereo
    width: 848
    height: 480
    fps: 30
    discard_frames: 5
  depth:
    backend: ffs
    model: third_party/Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth
    scale: 0.5
    valid_iters: 4
    max_disp: 192
  detector:
    backend: yolo
    weights: models/yolo26/best.pt
    confidence: 0.7
    iou: 0.7
    imgsz: 640
    max_det: 20
    device: 0
    classes: [watermelon, can, lunch_box, red_bag]
  segmenter:
    backend: efficient_sam
    weights: third_party/EfficientSAM/weights/efficient_sam_vitt.pt
    min_containment: 0.9
    min_coverage: 0.1
  obb_estimator:
    backend: point_cloud
    min_points: 100
    robust: true
    size_tolerance: 0.25
    priors:
      red_bag: [0.30, 0.15, 0.11]
      lunch_box: [0.21, 0.15, 0.05]

pipeline:
  box_scale: 1.25
