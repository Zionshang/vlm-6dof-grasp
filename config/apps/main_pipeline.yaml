# main_pipeline 组件组合:D435i 立体 → FFS 优化深度 → EconomicGrasp → o3d 可视化(无机械臂)
# 组件按 backend 名构建(见 core/components/),换组件只改这里。
components:
  camera:
    backend: d435i_stereo
    width: 640
    height: 480
    fps: 30
  depth:
    backend: ffs
    model: Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth
    scale: 0.5
    valid_iters: 4
    max_disp: 192
    width: 640
    height: 480
  grasp_engine:
    backend: economic
    checkpoint: economic_grasp/checkpoint/economicgrasp_epoch10.tar
    use_collision: true
  visualizer:
    backend: o3d
    title: "D435i FFS+Grasp  [Q] quit"
