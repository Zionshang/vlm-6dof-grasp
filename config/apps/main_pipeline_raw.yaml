# main_pipeline raw 路径:D435i(硬件 depth)→ mm 转 米 → EconomicGrasp → o3d(不走 FFS)
components:
  camera:
    backend: d435i
    width: 640
    height: 480
    fps: 30
    discard_frames: 5
  depth:
    backend: raw
  grasp_engine:
    backend: economic
    checkpoint: economic_grasp/checkpoint/economicgrasp_epoch10.tar
    use_collision: true
  visualizer:
    backend: o3d
    title: "D435i Grasp (raw)  [Q] quit"
